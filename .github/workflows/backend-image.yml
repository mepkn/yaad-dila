name: backend-image

on:
  push:
    branches: [main]
    paths:
      - 'backend/pb_hooks/**'
      - 'backend/pb_migrations/**'
      - 'backend/Dockerfile'
      - '.github/workflows/backend-image.yml'

permissions:
  contents: write
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      # Check out over SSH with the write deploy key so the compose-bump push
      # below is authenticated as the deploy key — the only actor allowed to
      # bypass the protect-main ruleset (GITHUB_TOKEN cannot bypass it).
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.CI_DEPLOY_KEY }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-backend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Pin the freshly built SHA tag into the deploy compose file and commit it
      # back to main. deploy/** is not in this workflow's trigger paths, so the
      # bump commit cannot retrigger the build.
      - name: Bump image tag in deploy compose
        run: |
          TAG="${GITHUB_SHA::7}"
          FILE="deploy/yaad-dila-prod/compose.yaml"
          sed -i -E "s|(image: ghcr.io/${{ github.repository }}-backend:).*|\1${TAG}|" "$FILE"
          if git diff --quiet "$FILE"; then
            echo "compose already pinned to ${TAG}, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Pin yaad-dila-prod image to ${TAG} [skip ci]"
          git pull --rebase origin main
          git push origin main

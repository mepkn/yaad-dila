# Source of truth for the VPS stack `yaad-dila-prod` (Dockhand git stack).
# Deploy: bump the image tag to the commit SHA you want, push, then pull +
# redeploy the stack in Dockhand.
# The tunnel maps yaad-dila.pknspace.com -> http://localhost:5340 (Cloudflare dashboard).
services:
  pocketbase:
    # Immutable tag (commit SHA from the backend-image workflow). Never :latest.
    image: ghcr.io/mepkn/yaad-dila-backend:3e3854c
    container_name: yaad-dila-pocketbase
    restart: unless-stopped
    ports:
      - '127.0.0.1:5340:8090'
    environment:
      - TZ=UTC
    volumes:
      - pb_data:/pb_data

# Named volume (not a bind dir): compose runs inside the Dockhand container,
# where relative host paths don't resolve — matches every other stack here.
volumes:
  pb_data:
    name: yaad-dila-pb-data

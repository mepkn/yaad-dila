# Source of truth for the VPS stack `pocketbase-prod` (Dockhand).
# Deploy: update the image tag to the commit SHA you want, copy this file to
# /app/data/stacks/vps-cmav/pocketbase-prod/ and re-up the stack.
# The tunnel maps pb.pknspace.com -> http://localhost:5340 (Cloudflare dashboard).
services:
  pocketbase:
    # Immutable tag (commit SHA from the backend-image workflow). Never :latest.
    image: ghcr.io/mepkn/yaad-dila-backend:3e3854c
    container_name: pocketbase
    restart: unless-stopped
    ports:
      - '127.0.0.1:5340:8090'
    environment:
      - TZ=UTC
    volumes:
      - ./pb_data:/pb_data
